<body>
<div class="shell"><aside><div class="brand"><div class="brand-icon">✦</div><span>우리 가족 여행</span></div><div style="width:100%"><div class="nav-label">메뉴</div><nav class="nav"><button class="active" id="navTrips"><span class="ico">▦</span><span class="label">여행 플랜</span></button><button id="navPast"><span class="ico">◷</span><span class="label">지난 여행</span></button><button id="navPhotos"><span class="ico">▧</span><span class="label">사진첩</span></button><button id="navFamily" title="가족 정보 편집" aria-label="가족 정보 편집"><span class="ico">👪</span><span class="label">가족 설정</span></button></nav></div><div class="side-bottom"><button class="family-card" id="familyCard" type="button"><div class="faces" id="familyFaces"></div><strong id="familyNameLabel">우리 가족</strong><p id="familyCountLabel">가족 정보를 편집해 보세요</p><small>가족 정보 편집　✎</small></button></div></aside>
<main><div class="topbar"><div class="crumb"><span id="crumbFamily">우리 가족</span> <span style="padding:0 7px">/</span> 여행 플랜</div><div class="top-actions"></div></div>
<header class="head"><div><div class="eyebrow">FAMILY TRAVEL JOURNAL</div><h1 id="pageTitle">우리 가족 여행 플랜</h1><p id="pageSub">함께 떠날 여행을 계획하고, 추억을 기록해요.</p></div><button class="primary" id="addTrip">＋ 여행 만들기</button></header>
<div class="tabs"><button class="tab active" data-view="upcoming">예정된 여행 <span id="upCount">0</span></button><button class="tab" data-view="past">지난 여행 <span id="pastCount">0</span></button><button class="tab" data-view="album">사진첩 <span id="albumCountTab">0</span></button></div>
<div class="content" id="tripContent"><section><div class="section-title"><h2 id="listTitle">여행 목록</h2><small id="tripCount"></small></div><div class="trip-list" id="tripList"></div></section><section><div class="detail schedule-panel"><div class="detail-heading"><div><div class="eyebrow" id="scheduleDestination">TRIP SCHEDULE</div><h2 id="itineraryTitle">여행 일정을 선택해 주세요</h2></div><div class="schedule-actions"><button type="button" class="secondary" id="showChecklist">체크리스트</button><button id="editTripInfo">여행 정보 편집</button></div></div><div class="schedule-toolbar"><div class="day-row" id="dayRow"></div><button class="primary" id="editItinerary">＋ 일정 추가</button></div><div class="day-summary" id="daySummary"></div><section class="day-photos"><div class="day-photos-head"><div><strong>오늘의 사진</strong><small id="dayPhotoLabel"></small></div><button type="button" class="secondary" id="dayUploadButton">＋ 사진 추가</button></div><div class="day-gallery" id="dayGallery"></div></section><div class="timeline" id="timeline"></div><div class="reflection schedule-reflection"><label for="reflectionInput">여행 소감</label><textarea id="reflectionInput" maxlength="300" placeholder="이번 여행에서 기억에 남는 순간을 짧게 적어보세요."></textarea><div class="reflection-foot"><small id="reflectionCount">0 / 300</small><button class="secondary" id="saveReflection" type="button">소감 저장</button></div></div></div></section></div>

<script>
const EMOJIS=['👩🏻','👨🏻','👧🏻','👦🏻'];const STORAGE='family-travel-planner-v1',FAMILY_KEY='family-travel-family-v1';let family=JSON.parse(localStorage.getItem(FAMILY_KEY)||'null')||{name:'우리 가족',members:['엄마','아빠','첫째','둘째']};function renderFamily(){document.title=family.name+' 여행 플랜';$('#familyNameLabel').textContent=family.name;$('#pageTitle').textContent=family.name+' 여행 플랜';$('#familyCountLabel').textContent=`${family.members.length}명 함께 여행해요`;$('#familyFaces').innerHTML=family.members.slice(0,5).map((n,i)=>`<i class="face" style="background:${['#f4dfcd','#dce8de','#e9e0f4','#f2e8bf','#dbe7f2'][i%5]}">${esc(n.slice(0,1))}</i>`).join('');$('#crumbFamily').textContent=family.name}function renderFamilyMemberFields(members){$('#familyMemberFields').innerHTML=members.map((name,i)=>`<div class="family-member-row"><input class="family-member-input" value="${esc(name)}" maxlength="40" aria-label="가족 구성원 ${i+1}" placeholder="이름"><button type="button" data-remove-member="${i}" aria-label="구성원 삭제">−</button></div>`).join('')} 
const sample=[{id:'jeju',name:'제주도 가을 가족 여행',start:'2026-10-17',end:'2026-10-20',destination:'제주도, 대한민국',address:'제주특별자치도',lat:33.4996,lng:126.5312,note:'오랜만에 떠나는 가족 여행! 바다도 보고 맛있는 것도 많이 먹기 🍊',events:[{date:'2026-10-17',time:'10:00',name:'제주 공항 도착',place:'제주국제공항'},{date:'2026-10-17',time:'12:00',name:'점심 — 흑돼지',place:'숙성도 제주본점'},{date:'2026-10-17',time:'15:00',name:'협재 해변 산책',place:'협재해수욕장'},{date:'2026-10-18',time:'09:30',name:'성산일출봉 오르기',place:'성산일출봉'},{date:'2026-10-18',time:'13:00',name:'우도에서 자전거',place:'우도'}],places:[{name:'협재해수욕장',type:'관광지',rating:5},{name:'숙성도 제주본점',type:'맛집',rating:4}],photos:[]},{id:'busan',name:'부산 바다 주말 여행',start:'2026-08-08',end:'2026-08-10',destination:'부산, 대한민국',address:'부산광역시',lat:35.1796,lng:129.0756,note:'해운대에서 놀고 광안대교 야경 보기',events:[{date:'2026-08-08',time:'11:00',name:'해운대 해수욕장',place:'해운대구'},{date:'2026-08-08',time:'18:30',name:'광안리 야경',place:'광안리해수욕장'}],places:[{name:'해운대 암소갈비',type:'맛집',rating:5}],photos:[]}];
let trips=JSON.parse(localStorage.getItem(STORAGE)||'null')||sample,view='upcoming',selectedId=null,dayIndex=0,map,marker,routeLayer,searchMarker;const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem(STORAGE,JSON.stringify(trips))}function dt(s){return new Date(s+'T00:00:00')}function fmt(s){return new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric'}).format(dt(s))}function days(t){let a=[];for(let d=dt(t.start),last=dt(t.end);d<=last;d.setDate(d.getDate()+1))a.push(new Date(d));return a}function iso(d){return d.toISOString().slice(0,10)}function dateRange(t){return fmt(t.start)+' – '+fmt(t.end)}function isPast(t){return !!t.archived||dt(t.end)<new Date(new Date().toDateString())}function currentList(){return trips.filter(t=>view==='past'?isPast(t):!isPast(t))}function selected(){return trips.find(t=>t.id===selectedId)||currentList()[0]||null}
function syncNav(){const activeId=view==='past'?'navPast':view==='album'?'navPhotos':'navTrips';$$('.nav button').forEach(b=>b.classList.toggle('active',b.id===activeId));$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}function render(){syncNav();const photoView=view==='album';$('#tripContent').hidden=photoView;$('#tripExtras').hidden=photoView;$('#archiveFooter').hidden=photoView||view==='past';$('#albumView').hidden=!photoView;$('#pageTitle').textContent=photoView?'사진첩':family.name+' 여행 플랜';$('#pageSub').textContent=photoView?'여행 사진을 연도별로 모아보세요.':'함께 떠날 여행을 계획하고, 추억을 기록해요.';const list=currentList();if(!selectedId||!list.some(t=>t.id===selectedId))selectedId=list[0]?.id||null;$('#upCount').textContent=trips.filter(t=>!isPast(t)).length;$('#pastCount').textContent=trips.filter(isPast).length;$('#listTitle').textContent=view==='past'?'지난 여행':'여행 목록';$('#tripCount').textContent=list.length+'개의 여행';$('#tripList').innerHTML=list.length?list.map(t=>`<article class="trip-card ${t.id===selectedId?'selected':''}" data-id="${t.id}"><div class="trip-main"><img class="trip-photo" src="${t.photos?.[0]||photoFallback(t)}"><div class="trip-info"><div class="trip-top"><h3>${esc(t.name)}</h3><span class="badge">${isPast(t)?'지난 여행':'여행 예정'}</span></div><div class="trip-sub">▣ ${dateRange(t)}　·　⌖ ${esc(t.destination)}</div></div></div><div class="trip-foot"><div class="people">${family.members.slice(0,4).map((n,i)=>`<i class="face" style="background:${['#f4dfcd','#dce8de','#e9e0f4','#f2e8bf'][i%4]}">${esc(n.slice(0,1))}</i>`).join('')} <span class="muted" style="margin-left:5px">가족 ${family.members.length}명</span></div><div class="trip-actions"><span class="muted">${t.events?.length||0}개 일정</span></div></div></article>`).join(''):'<div class="empty">여행이 없어요.<br>새 여행을 만들어 볼까요?</div>';renderDetail(selected());$('#archiveTripButton').hidden=view==='past'||photoView||!selected();if(photoView)renderAlbum()}
function renderDetail(t){if(!t){$('#scheduleDestination').textContent='TRIP SCHEDULE';$('#itineraryTitle').textContent='여행 일정을 선택해 주세요';$('#dayRow').innerHTML='';$('#daySummary').innerHTML='';$('#dayPhotoLabel').textContent='';$('#dayGallery').innerHTML='';$('#checklist').innerHTML='';$('#checkProgress').textContent='';$('#reflectionInput').value='';$('#reflectionCount').textContent='0 / 300';$('#timeline').innerHTML='<div class="empty">여행 목록에서 여행을 선택하면 날짜별 일정이 여기에 표시돼요.</div>';$('#places').innerHTML='<div class="muted">방문 장소를 기록해 보세요.</div>';return}$('#scheduleDestination').textContent=esc(t.destination||t.name);const ds=days(t);if(dayIndex>=ds.length)dayIndex=0;$('#dayRow').innerHTML=ds.map((d,i)=>`<button class="day ${i===dayIndex?'current':''}" data-day="${i}"><b>${i+1}일차</b>${d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',weekday:'short'})}</button>`).join('');const day=ds[dayIndex],dateKey=iso(day),events=(t.events||[]).filter(e=>e.date===dateKey).sort((a,b)=>a.time.localeCompare(b.time)),total=events.reduce((sum,e)=>sum+(e.budget==null?0:(Number(e.budget)||0)),0);$('#itineraryTitle').textContent=`${day.toLocaleDateString('ko-KR',{month:'long',day:'numeric'})} 일정`;$('#daySummary').innerHTML=`<span>${events.length}개 일정</span><span>오늘의 예산</span><strong>${total.toLocaleString('ko-KR')}원</strong>`;$('#dayPhotoLabel').textContent=`${dayIndex+1}일차 · ${day.toLocaleDateString('ko-KR',{month:'long',day:'numeric'})}`;$('#reflectionInput').value=t.reflection||'';$('#reflectionCount').textContent=`${(t.reflection||'').length} / 300`;const dayPhotos=(t.dayPhotos||{})[dateKey]||[];$('#dayGallery').innerHTML=dayPhotos.map((p,i)=>`<img src="${p}" alt="${dayIndex+1}일차 사진 ${i+1}">`).join('')+'<label class="upload-tile" for="dayPhotoInput"><span><b>＋</b><br>추가</span></label>';$('#timeline').innerHTML=events.length?events.map(e=>{const eventIndex=t.events.indexOf(e),placeName=e.place||e.name,existing=(t.places||[]).find(p=>p.name.trim().toLocaleLowerCase()===placeName.trim().toLocaleLowerCase()),rating=e.rating||existing?.rating||0;return `<div class="event"><time>${e.time}</time><div class="event-mark"><i></i></div><div class="event-card"><strong>${esc(e.name)}</strong><div>${esc(e.place||'장소 미정')}</div><div class="event-budget">${e.budget==null?'예산 미정':'예산　'+(Number(e.budget)||0).toLocaleString('ko-KR')+'원'}</div><div class="event-rating" aria-label="방문 장소 별점">${[1,2,3,4,5].map(n=>`<button type="button" data-event-rating="${n}" data-event-index="${eventIndex}" aria-label="별점 ${n}">${n<=rating?'★':'☆'}</button>`).join('')}</div></div></div>`}).join(''):'<div class="muted" style="padding:20px 0 24px">이 날의 일정이 아직 없어요. 일정을 추가해 보세요.</div>';const checklist=t.checklist||[],checked=checklist.filter(i=>i.done).length;$('#checkProgress').textContent=`${checked} / ${checklist.length} 완료`;$('#checklist').innerHTML=checklist.length?checklist.map((item,i)=>`<div class="check-item ${item.done?'done':''}"><input id="check-${i}" type="checkbox" data-check="${i}" ${item.done?'checked':''}><label for="check-${i}">${esc(item.text)}</label><button type="button" class="check-delete" data-check-delete="${i}" aria-label="항목 삭제">×</button></div>`).join(''):'<div class="muted" style="padding:10px 0">체크리스트 항목이 없어요. 준비물을 추가해 보세요.</div>';const places=t.places||[];$('#places').innerHTML=places.length?places.map((p,i)=>`<div class="place-row"><div class="place-emoji">${typeEmoji(p.type)}</div><div class="place-name"><strong>${esc(p.name)}</strong><small>${esc(p.type||'장소')}</small></div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star-button" data-place="${i}" data-rating="${n}" aria-label="별점 ${n}">${n<=p.rating?'★':'☆'}</button>`).join('')}</div></div>`).join(''):'<div class="muted">아직 기록한 장소가 없어요.</div>'}
function renderAlbum(){const photos=[];for(const t of trips){for(const src of t.photos||[])photos.push({src,trip:t.name,date:t.start||'',label:'여행 사진'});for(const [date,items] of Object.entries(t.dayPhotos||{}))for(const src of items)photos.push({src,trip:t.name,date,label:new Date(date+'T00:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric'})})}const years=[...new Set(photos.map(p=>p.date.slice(0,4)).filter(y=>/^\d{4}$/.test(y)))].sort((a,b)=>b.localeCompare(a)),select=$('#albumYear'),previous=select.value||'all';select.innerHTML='<option value="all">전체 연도</option>'+years.map(y=>`<option value="${y}">${y}년 (${photos.filter(p=>p.date.startsWith(y)).length})</option>`).join('');select.value=years.includes(previous)||previous==='all'?previous:'all';const filtered=select.value==='all'?photos:photos.filter(p=>p.date.startsWith(select.value));$('#albumCount').textContent=`사진 ${filtered.length}장`;$('#albumCountTab').textContent=photos.length;$('#albumGallery').innerHTML=filtered.length?filtered.map((p,i)=>`<figure class="album-item"><img src="${p.src}" alt="${esc(p.trip)} ${esc(p.label)} 사진 ${i+1}"><figcaption><strong>${esc(p.trip)}</strong><small>${esc(p.label)} · ${p.date.slice(0,4)}년</small></figcaption></figure>`).join(''):'<div class="empty">선택한 연도에 등록된 사진이 없어요.</div>'}
