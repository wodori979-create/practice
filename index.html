let trips=JSON.parse(localStorage.getItem(STORAGE)||'null')||sample,view='upcoming',selectedId=null,dayIndex=0,map,marker,routeLayer,searchMarker;const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem(STORAGE,JSON.stringify(trips))}function dt(s){return new Date(s+'T00:00:00')}function fmt(s){return new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric'}).format(dt(s))}function days(t){let a=[];for(let d=dt(t.start),last=dt(t.end);d<=last;d.setDate(d.getDate()+1))a.push(new Date(d));return a}function iso(d){return d.toISOString().slice(0,10)}function dateRange(t){return fmt(t.start)+' – '+fmt(t.end)}function isPast(t){return !!t.archived||dt(t.end)<new Date(new Date().toDateString())}function currentList(){return trips.filter(t=>view==='past'?isPast(t):!isPast(t))}function selected(){return trips.find(t=>t.id===selectedId)||currentList()[0]||null}
function render(){const list=currentList();if(!selectedId||!list.some(t=>t.id===selectedId))selectedId=list[0]?.id||null;$('#upCount').textContent=trips.filter(t=>!isPast(t)).length;$('#pastCount').textContent=trips.filter(isPast).length;$('#listTitle').textContent=view==='past'?'지난 여행':'여행 목록';$('#tripCount').textContent=list.length+'개의 여행';$('#tripList').innerHTML=list.length?list.map(t=>`<article class="trip-card ${t.id===selectedId?'selected':''}" data-id="${t.id}"><div class="trip-main"><img class="trip-photo" src="${t.photos?.[0]||photoFallback(t)}"><div class="trip-info"><div class="trip-top"><h3>${esc(t.name)}</h3><span class="badge">${isPast(t)?'지난 여행':'여행 예정'}</span></div><div class="trip-sub">▣ ${dateRange(t)}　·　⌖ ${esc(t.destination)}</div></div></div><div class="trip-foot"><div class="people">${EMOJIS.map(e=>`<i class="face">${e}</i>`).join('')} <span class="muted" style="margin-left:5px">가족 4명</span></div><div class="trip-actions"><span class="muted">${t.events?.length||0}개 일정</span>${view==='upcoming'?`<button class="move-past" data-move="${t.id}">지난 여행으로 이동</button>`:''}</div></div></article>`).join(''):'<div class="empty">여행이 없어요.<br>새 여행을 만들어 볼까요?</div>';renderDetail(selected())}
function renderDetail(t){if(!t){$('#scheduleDestination').textContent='TRIP SCHEDULE';$('#itineraryTitle').textContent='여행 일정을 선택해 주세요';$('#dayRow').innerHTML='';$('#daySummary').innerHTML='';$('#timeline').innerHTML='<div class="empty">여행 목록에서 여행을 선택하면 날짜별 일정이 여기에 표시돼요.</div>';$('#gallery').innerHTML='<label class="upload-tile" for="photoInput"><span><b>＋</b><br>사진 추가</span></label>';$('#places').innerHTML='<div class="muted">방문 장소를 기록해 보세요.</div>';return}$('#scheduleDestination').textContent=esc(t.destination||t.name);const ds=days(t);if(dayIndex>=ds.length)dayIndex=0;$('#dayRow').innerHTML=ds.map((d,i)=>`<button class="day ${i===dayIndex?'current':''}" data-day="${i}"><b>${i+1}일차</b>${d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',weekday:'short'})}</button>`).join('');const day=ds[dayIndex],events=(t.events||[]).filter(e=>e.date===iso(day)).sort((a,b)=>a.time.localeCompare(b.time)),total=events.reduce((sum,e)=>sum+(e.budget==null?0:(Number(e.budget)||0)),0);$('#itineraryTitle').textContent=`${day.toLocaleDateString('ko-KR',{month:'long',day:'numeric'})} 일정`;$('#daySummary').innerHTML=`<span>${events.length}개 일정</span><span>오늘의 예산</span><strong>${total.toLocaleString('ko-KR')}원</strong>`;$('#timeline').innerHTML=events.length?events.map(e=>`<div class="event"><time>${e.time}</time><div class="event-mark"><i></i></div><div class="event-card"><strong>${esc(e.name)}</strong><div>${esc(e.place||'장소 미정')}</div><div class="event-budget">${e.budget==null?'예산 미정':'예산　'+(Number(e.budget)||0).toLocaleString('ko-KR')+'원'}</div></div></div>`).join(''):'<div class="muted" style="padding:20px 0 24px">이 날의 일정이 아직 없어요. 일정을 추가해 보세요.</div>';const photos=(t.photos||[]).slice(-5).map((p,i)=>`<img src="${p}" alt="여행 사진 ${i+1}">`).join('');$('#gallery').innerHTML=photos+'<label class="upload-tile" for="photoInput"><span><b>＋</b><br>사진 추가</span></label>';const places=t.places||[];$('#places').innerHTML=places.length?places.map((p,i)=>`<div class="place-row"><div class="place-emoji">${typeEmoji(p.type)}</div><div class="place-name"><strong>${esc(p.name)}</strong><small>${esc(p.type||'장소')}</small></div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star-button" data-place="${i}" data-rating="${n}" aria-label="별점 ${n}">${n<=p.rating?'★':'☆'}</button>`).join('')}</div></div>`).join(''):'<div class="muted">아직 기록한 장소가 없어요.</div>'}
function photoFallback(t){return `https://images.unsplash.com/photo-${t.id==='jeju'?'1500530855697-b586d89ba3ee':'1519501025264-65ba15a82390'}?auto=format&fit=crop&w=240&q=75`}function typeEmoji(x){return ({'맛집':'🍜','관광지':'🏞️','카페':'☕','숙소':'🏡','기타':'📍'})[x]||'📍'}function avg(t){return ((t.places||[]).reduce((a,p)=>a+p.rating,0)/(t.places||[]).length||0).toFixed(1)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
$('#tripList').addEventListener('click',e=>{const move=e.target.closest('[data-move]');if(move){e.stopPropagation();const t=trips.find(x=>x.id===move.dataset.move);if(t){t.archived=true;save();selectedId=null;render();toast('지난 여행으로 옮겼어요.')}return}const c=e.target.closest('.trip-card');if(c){selectedId=c.dataset.id;dayIndex=0;render();if(window.innerWidth<=660)document.querySelector('.schedule-panel').scrollIntoView({behavior:'smooth',block:'start'})}});$('#dayRow').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(b){dayIndex=+b.dataset.day;renderDetail(selected())}});$$('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;selectedId=null;dayIndex=0;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('#navTrips').onclick=()=>{view='upcoming';selectedId=null;dayIndex=0;$$('.tab').forEach((x,i)=>x.classList.toggle('active',!i));render()};$('#navPast').onclick=()=>{view='past';selectedId=null;dayIndex=0;$$('.tab').forEach((x,i)=>x.classList.toggle('active',i===1));render()};$('#navPhotos').onclick=()=>{$('#uploadButton').click()};$('#addTrip').onclick=()=>{ $('#tripForm').reset();$('#tripId').value='';$('#tripModalTitle').textContent='새 여행 만들기';$('#tripDialog').showModal()};
$('#tripForm').onsubmit=e=>{e.preventDefault();const id=$('#tripId').value||crypto.randomUUID(),old=trips.find(t=>t.id===id);const t={id,name:$('#tripName').value.trim(),start:$('#startDate').value,end:$('#endDate').value,destination:$('#destination').value.trim(),note:$('#tripNote').value,events:old?.events||[],places:old?.places||[],photos:old?.photos||[],archived:old?.archived||false};if(t.end<t.start){toast('마지막 날짜를 시작 날짜 이후로 선택해 주세요.');return}if(old)trips=trips.map(x=>x.id===id?t:x);else trips.unshift(t);selectedId=id;save();$('#tripDialog').close();render();toast(old?'여행 정보를 수정했어요.':'새 여행을 만들었어요.')};$('#tripList').addEventListener('dblclick',e=>{const c=e.target.closest('.trip-card');if(!c)return;const t=trips.find(x=>x.id===c.dataset.id);$('#tripId').value=t.id;$('#tripName').value=t.name;$('#startDate').value=t.start;$('#endDate').value=t.end;$('#destination').value=t.destination;$('#tripNote').value=t.note||'';$('#tripModalTitle').textContent='여행 정보 편집';$('#tripDialog').showModal()});
$('#editTripInfo').onclick=()=>{const t=selected();if(!t)return toast('먼저 여행을 선택해 주세요.');$('#tripId').value=t.id;$('#tripName').value=t.name;$('#startDate').value=t.start;$('#endDate').value=t.end;$('#destination').value=t.destination;$('#tripNote').value=t.note||'';$('#tripModalTitle').textContent='여행 정보 편집';$('#tripDialog').showModal()};$('#editItinerary').onclick=()=>{const t=selected();if(!t)return toast('먼저 여행을 선택해 주세요.');$('#eventDay').innerHTML=days(t).map((d,i)=>`<option value="${iso(d)}">${i+1}일차 · ${d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</option>`).join('');$('#eventDay').value=iso(days(t)[dayIndex]);$('#eventForm').reset();$('#eventDay').value=iso(days(t)[dayIndex]);$('#eventDialog').showModal()};$('#eventForm').onsubmit=e=>{e.preventDefault();const t=selected();t.events.push({date:$('#eventDay').value,time:$('#eventTime').value,name:$('#eventName').value.trim(),place:$('#eventPlace').value.trim(),budget:Number($('#eventBudget').value)||0});save();$('#eventDialog').close();renderDetail(t);toast('일정을 추가했어요.')};$('#addPlace').onclick=()=>{if(!selected())return toast('먼저 여행을 선택해 주세요.');$('#placeForm').reset();$('#placeRating').value=5;paintStars(5);$('#placeDialog').showModal()};function paintStars(n){$('#ratingPicker').innerHTML=[1,2,3,4,5].map(i=>`<span data-rate="${i}" style="cursor:pointer;color:${i<=n?'#d98a34':'#d9ddd6'}">★</span>`).join('')}$('#ratingPicker').onclick=e=>{if(e.target.dataset.rate){$('#placeRating').value=e.target.dataset.rate;paintStars(+e.target.dataset.rate)}};$('#placeForm').onsubmit=e=>{e.preventDefault();const t=selected();t.places.push({name:$('#placeName').value.trim(),type:$('#placeType').value,rating:+$('#placeRating').value});save();$('#placeDialog').close();renderDetail(t);render();toast('방문 장소를 기록했어요.')};$('#places').addEventListener('click',e=>{const b=e.target.closest('[data-rating]');if(!b)return;const t=selected();t.places[+b.dataset.place].rating=+b.dataset.rating;save();renderDetail(t);render()});
$('#uploadButton').onclick=()=>$('#photoInput').click();$('#photoInput').onchange=async e=>{const t=selected();if(!t)return toast('먼저 여행을 선택해 주세요.');for(const f of [...e.target.files]){if(!f.type.startsWith('image/'))continue;try{const data=await compress(f);t.photos.push(data)}catch{toast('사진을 처리하지 못했어요.')}}try{save();renderDetail(t);render();toast('사진을 추가했어요.')}catch{toast('저장 공간이 부족해요. 사진 크기를 줄여 주세요.')}e.target.value=''};function compress(file){return new Promise((resolve,reject)=>{const im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{const scale=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78))};im.onerror=reject;im.src=url})}
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());render();
